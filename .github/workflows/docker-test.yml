name: Docker Export Test

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  docker-export:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download sample Archi model
        run: |
          curl -L \
            "https://raw.githubusercontent.com/archimatetool/archi/master/tests/com.archimatetool.testsupport/testdata/models/Archisurance.archimate" \
            -o /tmp/Archisurance.archimate

      - name: Build Archi image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          tags: gradle-archi-plugin-archi:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run docker export verification
        env:
          SKIP_DOCKER_BUILD: "1"
        run: |
          ./scripts/docker-local-test.sh /tmp/Archisurance.archimate

      - name: Upload docker export artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-archi-export
          path: build/archi-export/

